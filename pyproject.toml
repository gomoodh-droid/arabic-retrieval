[project]
name = "arabic-retrieval-lab"
version = "0.1.0"
description = "باحث عربي مقيس + مختبر يكتشف أفضل إعدادات الاسترجاع لنصك — إعداد وتطوير: عبدالرحمن رفاعي"
authors = [{name = "Abdulrahman Refai", email = "abdulrahman@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["arabic", "retrieval", "rag", "bm25", "nlp", "عربي", "عبدالرحمن رفاعي"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["arl*"]

[tool.setuptools.package-data]
arl = ["data/*.json"]
