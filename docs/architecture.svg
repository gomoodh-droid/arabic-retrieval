<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#0F172A; font-family: system-ui, -apple-system, sans-serif;">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #F8FAFC; }
    .sub { font-size: 12px; fill: #94A3B8; }
    .box-title { font-size: 14px; font-weight: bold; fill: #38BDF8; }
    .node-title { font-size: 13px; font-weight: bold; fill: #F8FAFC; }
    .node-desc { font-size: 11px; fill: #CBD5E1; }
    .arrow { stroke: #38BDF8; stroke-width: 2; fill: none; stroke-dasharray: 4 2; }
    .line { stroke: #64748B; stroke-width: 2; fill: none; }
  </style>

  <!-- Title Header -->
  <text x="475" y="35" text-anchor="middle" class="title">المعمارية الهندسيـة لمختبر الاسترجاع العربي (Arabic Retrieval Lab Architecture)</text>

  <!-- Step 1: Input -->
  <rect x="30" y="65" width="200" height="370" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" class="box-title">1. الإدخال والبصمة</text>
  
  <rect x="45" y="120" width="170" height="90" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <text x="130" y="150" text-anchor="middle" class="node-title">📖 المتن الأصلي</text>
  <text x="130" y="175" text-anchor="middle" class="node-desc">نصوص + أسئلة التقييم</text>

  <rect x="45" y="260" width="170" height="90" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <text x="130" y="290" text-anchor="middle" class="node-title">🔍 بصمة المتن</text>
  <text x="130" y="315" text-anchor="middle" class="node-desc">13 خاصية لغوية</text>

  <!-- Step 2: Engine -->
  <rect x="250" y="65" width="210" height="370" rx="12" fill="#064E3B" stroke="#047857" stroke-width="2"/>
  <text x="355" y="95" text-anchor="middle" fill="#34D399" class="box-title">2. محرك التقييم والقياس</text>
  
  <rect x="265" y="120" width="180" height="75" rx="8" fill="#022C22" stroke="#34D399" stroke-width="1.5"/>
  <text x="355" y="150" text-anchor="middle" class="node-title">⚙️ فضاء الاستراتيجيات</text>
  <text x="355" y="170" text-anchor="middle" class="node-desc">تطبيع × تقطيع × تجذيع</text>

  <rect x="265" y="210" width="180" height="75" rx="8" fill="#022C22" stroke="#34D399" stroke-width="1.5"/>
  <text x="355" y="240" text-anchor="middle" class="node-title">📏 المسطرة الحتمية</text>
  <text x="355" y="260" text-anchor="middle" class="node-desc">Recall@k · MRR · latency</text>

  <rect x="265" y="300" width="180" height="75" rx="8" fill="#022C22" stroke="#34D399" stroke-width="1.5"/>
  <text x="355" y="330" text-anchor="middle" class="node-title">⚖️ الاختبار الإحصائي</text>
  <text x="355" y="350" text-anchor="middle" class="node-desc">Paired Bootstrap Test</text>

  <!-- Step 3: Decision -->
  <rect x="480" y="65" width="200" height="370" rx="12" fill="#312E81" stroke="#4338CA" stroke-width="2"/>
  <text x="580" y="95" text-anchor="middle" fill="#818CF8" class="box-title">3. فلترة القرار</text>
  
  <rect x="495" y="120" width="170" height="85" rx="8" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
  <text x="580" y="150" text-anchor="middle" class="node-title">📊 جبهة باريتو</text>
  <text x="580" y="175" text-anchor="middle" class="node-desc">توازن الدقة مع الموارد</text>

  <rect x="495" y="220" width="170" height="85" rx="8" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
  <text x="580" y="250" text-anchor="middle" class="node-title">⏱️ قيود الميزانية</text>
  <text x="580" y="275" text-anchor="middle" class="node-desc">زمن ≤ 50ms | ذاكرة ≤ 2GB</text>

  <rect x="495" y="320" width="170" height="90" rx="8" fill="#581C87" stroke="#F43F5E" stroke-width="3"/>
  <text x="580" y="355" text-anchor="middle" class="node-title">🏆 التهيئة الموصى بها</text>
  <text x="580" y="380" text-anchor="middle" fill="#FFE4E6" class="node-desc">الخيار الأفضل لبياناتك</text>

  <!-- Step 4: Export -->
  <rect x="700" y="65" width="220" height="370" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <text x="810" y="95" text-anchor="middle" fill="#F59E0B" class="box-title">4. النشر والتكامل</text>

  <rect x="715" y="140" width="190" height="95" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="810" y="175" text-anchor="middle" class="node-title">⚡ ArabicRetriever</text>
  <text x="810" y="200" text-anchor="middle" class="node-desc">استدعاء محلي بـ 3 أسطر</text>

  <rect x="715" y="260" width="190" height="95" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="810" y="295" text-anchor="middle" class="node-title">🌐 Elasticsearch / OpenSearch</text>
  <text x="810" y="320" text-anchor="middle" class="node-desc">+ تقرير المبررات الهندسي</text>

  <!-- Connectors -->
  <path d="M 215 165 L 265 155" class="line"/>
  <path d="M 445 155 L 495 160" class="line"/>
  <path d="M 665 365 L 715 190" class="line"/>
  <path d="M 665 365 L 715 310" class="line"/>
</svg>
